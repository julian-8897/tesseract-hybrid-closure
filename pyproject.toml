[project]
name = "tesseract-hybrid-closure"
version = "0.1.0"
description = "Cross-framework learned closure for differentiable 2D turbulence"
license = "Apache-2.0"
readme = "README.md"
authors = [{ name = "julian-8897" }]
requires-python = ">=3.13"
dependencies = [
    "exponax==0.2.0",
    "matplotlib==3.11.1",
    "numpy==2.5.1",
    "optax==0.2.8",
    "tesseract-core[runtime]==1.11.0",
    "tesseract-jax==0.4.1",
    "torch==2.13.0",
]

[project.scripts]
hybrid-closure = "tesseract_hybrid_closure.cli:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "marimo==0.24.0",
    "pytest==9.1.1",
    "ruff==0.16.2",
]

[tool.pytest.ini_options]
markers = [
    "gradient_smoke: single-step cross-framework gradient smoke test (JAX solver + PyTorch closure)",
    "rollout_smoke: 30-step rollout gradient and short training-curriculum smoke tests",
    "container: containerised two-Tesseract composition smoke test (needs Docker + built images)",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Deterministic XLA flags must be set before the JAX import in this script.
"scripts/generate_submission_assets.py" = ["E402"]
