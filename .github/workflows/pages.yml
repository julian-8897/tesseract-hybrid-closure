name: Deploy browser walkthrough

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages.yml"
      - "notebooks/browser_walkthrough.py"
      - "notebooks/public/**"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    name: Export and deploy marimo app
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Export browser walkthrough
        run: |
          uvx --from marimo==0.24.0 marimo export html-wasm \
            notebooks/browser_walkthrough.py \
            -o site \
            --mode run

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
